name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release publishing (tag v*) needs contents:write; everything else read-only.
permissions:
  contents: write

env:
  # Release signing is optional: the repo builds unsigned/debug-signed by default.
  HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    name: Build APK (arm64-v8a) + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules if present)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK (Temurin 17, pinned)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3
        with:
          # legacy 'tools' package no longer exists in the SDK repository
          packages: platform-tools

      - name: Install pinned SDK packages, NDK + CMake
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK (arm64-v8a)
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests (JVM, synthetic fixtures — no game data)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Native host tests (cmake/ctest, synthetic fixtures — no game data)
        run: |
          cmake -S tests/native -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
          ctest --test-dir build-native --output-on-failure

      - name: Verify 16 KB page-size alignment of all packed .so
        run: |
          set -e
          fail=0
          for so in $(find app/build -name '*.so' -path '*arm64*'); do
            max_align=$(readelf -lW "$so" | awk '/LOAD/ {print $NF}' | sort -u | head -n1)
            echo "$so -> align $max_align"
            case "$max_align" in
              0x4000|16384) : ;;
              *) echo "ERROR: $so is not 16 KB aligned ($max_align)"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Assemble release APK (only when keystore secret is configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          rm -f /tmp/release.keystore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacNativeGames-Android-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
